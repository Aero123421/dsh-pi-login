name: Pi plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fail when published source or dist calls addLanguage
        run: 'rc=0; grep -rnF addLanguage src dist || rc=$?; test "$rc" -eq 1'
      - run: git diff --exit-code --stat -- dist
      - run: npm test
      - run: npm run test:peers
      - run: npm run test:compat
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run pack:plugin
      - name: Upload package and UI comparison
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pi-login-${{ github.sha }}
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
            .github/ui-review/
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned DSH CLI and pnpm for real profile smoke
        run: npm install --prefix .cache/dsh-cli --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.2 pnpm@11.28.5
      - name: Verify installed profile and live Release lookup
        run: PATH="$PWD/.cache/dsh-cli/node_modules/.bin:$PATH" npm run test:install
      - name: Install cutoff DSH next for real profile regression
        run: npm install --prefix .cache/dsh-cli-next --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.5 pnpm@11.28.5
      - name: Check consumer types against cutoff DSH next
        run: |
          cp tests/host-api-contract.mts .cache/dsh-cli-next/pi-host-contract.mts
          node_modules/.bin/tsc --noEmit --strict --skipLibCheck --module NodeNext --moduleResolution NodeNext --target ES2022 --types node --typeRoots "$PWD/node_modules/@types" .cache/dsh-cli-next/pi-host-contract.mts
      - name: Verify installed profile and live Release lookup on cutoff DSH next
        run: PATH="$PWD/.cache/dsh-cli-next/node_modules/.bin:$PATH" npm run test:install
      - name: Boot the same package on the cutoff DSH alpha
        run: |
          npm install --prefix .cache/dsh-cli-alpha --ignore-scripts @deepseek-ai/dsh@0.2.2-alpha.2 pnpm@11.28.5
          PATH="$PWD/.cache/dsh-cli-alpha/node_modules/.bin:$PATH" npm run test:boot
