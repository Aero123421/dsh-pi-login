name: Pi plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code --stat -- dist
      - run: npm test
      - run: npm run test:compat
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run pack:plugin
      - name: Install pinned DSH CLI for real profile smoke
        run: npm install --prefix .cache/dsh-cli --ignore-scripts @deepseek-ai/dsh@0.2.1-alpha.2
      - name: Verify installed profile and live Release lookup
        run: PATH="$PWD/.cache/dsh-cli/node_modules/.bin:$PATH" npm run test:install
