name: Publish Pi plugin release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select release tag and notes
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          tag="v$version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            echo 'The pushed tag does not match package.json.' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -f ".github/release-notes/$tag.md" ]; then
            cp ".github/release-notes/$tag.md" "$RUNNER_TEMP/pi-release-notes.md"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false
      - name: Verify tagged package version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" = "$RELEASE_TAG"
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code --stat -- dist
      - run: npm test
      - run: npm run test:compat
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run pack:plugin
      - name: Verify package checksum
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
      - name: Install pinned DSH CLI and pnpm for real profile smoke
        run: npm install --prefix .cache/dsh-cli --ignore-scripts @deepseek-ai/dsh@0.2.1-alpha.2 pnpm@11.28.5
      - name: Verify installed profile and live Release lookup
        run: PATH="$PWD/.cache/dsh-cli/node_modules/.bin:$PATH" npm run test:install
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          package="artifacts/local-dsh-pi-login-${RELEASE_TAG#v}.tgz"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" = false ]; then
              echo 'This release is already published; leaving its assets unchanged.'
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$package" artifacts/SHA256SUMS --clobber
          else
            notes=(--generate-notes)
            if [ -f "$RUNNER_TEMP/pi-release-notes.md" ]; then
              notes=(--notes-file "$RUNNER_TEMP/pi-release-notes.md")
            fi
            gh release create "$RELEASE_TAG" "$package" artifacts/SHA256SUMS \
              --verify-tag --draft --title "$RELEASE_TAG" "${notes[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,isDraft,assets
