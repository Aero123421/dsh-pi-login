name: Publish Pi plugin release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Select release tag and notes
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          tag="v$version"
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "$tag" ]; then
            echo 'The pushed tag does not match package.json.' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false
      - name: Verify tagged package version
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')" = "$RELEASE_TAG"
          if [ -f ".github/release-notes/$RELEASE_TAG.md" ]; then
            cp ".github/release-notes/$RELEASE_TAG.md" "$RUNNER_TEMP/pi-release-notes.md"
          fi
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code --stat -- dist
      - run: npm test
      - run: npm run test:peers
      - run: npm run test:compat
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run pack:plugin
      - name: Verify package checksum
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
      - name: Install pinned DSH CLI and pnpm for real profile smoke
        run: npm install --prefix .cache/dsh-cli --ignore-scripts @deepseek-ai/dsh@0.2.1-rc.2 pnpm@11.28.5
      - name: Verify installed profile and live Release lookup
        run: PATH="$PWD/.cache/dsh-cli/node_modules/.bin:$PATH" npm run test:install
      - name: Boot the same package on the current DSH alpha
        run: |
          npm install --prefix .cache/dsh-cli-alpha --ignore-scripts @deepseek-ai/dsh@alpha pnpm@11.28.5
          PATH="$PWD/.cache/dsh-cli-alpha/node_modules/.bin:$PATH" npm run test:boot
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/pi-release-notes.md
        run: node scripts/release-assets.mjs "artifacts/local-dsh-pi-login-${RELEASE_TAG#v}.tgz" artifacts/SHA256SUMS
